baseURL: /
languageCode: en-us
title: stdrice

theme: ["PaperMod"]

params:
  defaultTheme: auto
  ShowToc: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  disableThemeToggle: true
  ShowReadingTime: false
  ShowFullTextinRSS: true
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title"]

menu:
  main:
    - identifier: me
      name: "me"
      url: "/me"
      weight: 1
    - identifier: projects
      name: "projects"
      url: "/projects"
      weight: 2
    - identifier: posts
      name: "posts"
      url: "/posts"
      weight: 3
    - identifier: pages
      name: "pages"
      url: "/pages"
      weight: 4
    - identifier: search
      name: "search"
      url: "/search"
      weight: 5
    - identifier: rss
      name: "rss"
      url: "/index.xml"
      weight: 6

markup:
  goldmark:
    renderer:
      unsafe: true

caches:
  images:
    dir: :cacheDir/images

outputs:
  home:
    - HTML
    - RSS
    - JSON
